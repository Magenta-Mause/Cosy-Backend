name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short-sha: ${{ steps.short-sha.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Get short SHA
        id: short-sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set lowercase image name
        id: image
        run: echo "IMAGE_NAME_LOWER=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image name in pom.xml
        run: |
          sed -i "s|<name>cosy-backend:\${project.version}</name>|<name>${{ env.REGISTRY }}/${{ steps.image.outputs.IMAGE_NAME_LOWER }}:sha-${{ steps.short-sha.outputs.sha }}</name>|" pom.xml

      - name: Build image
        run: ./mvnw spring-boot:build-image

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/${{ steps.image.outputs.IMAGE_NAME_LOWER }}:sha-${{ steps.short-sha.outputs.sha }}

  update-deployment:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DEPLOYMENT_APP_ID }}
          private-key: ${{ secrets.DEPLOYMENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "cosy-internal-deployment"

      - name: Trigger deployment update
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ steps.app-token.outputs.token }}" \
            https://api.github.com/repos/${{ github.repository_owner }}/cosy-internal-deployment/dispatches \
            -d '{"event_type":"update_image","client_payload":{"service":"backend","commit_sha":"sha-${{ needs.build-and-push-image.outputs.short-sha }}"}}'

