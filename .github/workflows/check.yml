name: Check Formatting and Test

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cosy_ci
          POSTGRES_USER: cosy
          POSTGRES_PASSWORD: cosy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cosy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check Formatting (Spotless)
        run: mvn -B spotless:check

      - name: Build and Verify
        run: mvn -B verify
        env:
          CI_PG_TESTS: "true"

