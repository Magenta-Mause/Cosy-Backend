services:
  postgres:
    image: postgres:16-alpine
    container_name: cosy-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=cosy
      - POSTGRES_USER=cosy
      - POSTGRES_PASSWORD=cosy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosy"]
      interval: 10s
      timeout: 5s
      retries: 5
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
    expose:
      - "3100"
  nginx:
    image: nginx:1.25
    container_name: loki-nginx
    ports:
      - "3100:80"
    volumes:
      - ./loki-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - loki
volumes:
  postgres_data:
  loki-data:
