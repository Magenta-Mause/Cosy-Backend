services:
  postgres:
    image: postgres:16-alpine
    container_name: cosy-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=cosy
      - POSTGRES_USER=cosy
      - POSTGRES_PASSWORD=cosy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosy"]
      interval: 10s
      timeout: 5s
      retries: 5
  influx:
    image: influxdb:2.7-alpine
    container_name: cosy-influx
    ports:
    - "8086:8086"
    volumes:
      - influx_data:/var/lib/influxdb2
      - influx_config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: cosy
      DOCKER_INFLUXDB_INIT_PASSWORD: cosy-password
      DOCKER_INFLUXDB_INIT_ORG: cosy-org
      DOCKER_INFLUXDB_INIT_BUCKET: cosy-bucket
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: e8996bf24977ce5615015c717447911799207025d1998a01256b7b7717bac18e
volumes:
  influx_data:
  influx_config:
  postgres_data:
