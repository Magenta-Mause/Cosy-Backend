services:
  postgres:
    image: postgres:16-alpine
    container_name: cosy-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=cosy
      - POSTGRES_USER=cosy
      - POSTGRES_PASSWORD=cosy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosy"]
      interval: 10s
      timeout: 5s
      retries: 5
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - loki-data:/loki
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
    expose:
      - "3100"
  nginx:
    image: nginx:1.25
    container_name: loki-nginx
    ports:
      - "3100:80"
    volumes:
      - ./loki-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - loki
  influx:
    image: influxdb:2.7-alpine
    container_name: cosy-influx
    ports:
    - "8086:8086"
    volumes:
      - influx_data:/var/lib/influxdb2
      - influx_config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: cosy
      DOCKER_INFLUXDB_INIT_PASSWORD: cosy-password
      DOCKER_INFLUXDB_INIT_ORG: cosy-org
      DOCKER_INFLUXDB_INIT_BUCKET: cosy-bucket
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: cosy-admin-token
volumes:
  influx_data:
  influx_config:
  postgres_data:
  loki-data:
