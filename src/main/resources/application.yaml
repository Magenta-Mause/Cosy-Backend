server:
  servlet:
    context-path: /api
spring:
  application:
    name: cosy-backend
  mvc:
    async:
      request-timeout: -1
  datasource:
    url: jdbc:postgresql://localhost:5432/cosy
    username: cosy
    password: cosy
    driver-class-name: org.postgresql.Driver
  flyway:
    # baseline-on-migrate exists only to migrate pre-Flyway deployments: on their first
    # boot after this upgrade Flyway finds a non-empty schema, stamps it as V1 (baseline)
    # and then applies V2+. It accepts ANY non-empty schema without inspecting it, so a
    # drifted schema would be silently baselined as if it were a clean V1.
    # REMOVE this one release after this rollout. Afterwards: an empty DB migrates normally,
    # and a still-not-upgraded pre-Flyway DB fails with a clear Flyway error ("found non-empty
    # schema without schema history table") instead of being silently baselined incorrectly.
    baseline-on-migrate: true
    baseline-version: "1"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    property-naming-strategy: SNAKE_CASE
  task:
    scheduling:
      # Defaults to 1, which would let a slow engine call in the reconciliation sweep stall the
      # unrelated @Scheduled tasks in TemplateService and MetricsService.
      pool:
        size: 3
jwt:
  secret-key: ${COSY_JWT_SECRET_KEY:e8996bf24977ce5615015c717447911799207025d1998a01256b7b7717bac18e} #change in prod
  identity-token-expiration-time: 3600000 #1 hour
  refresh-token-expiration-time: 2678400000 #1 month
management:
  endpoints:
    web:
      exposure:
        include: "health,readiness,liveness"

cosy:
  security:
    # Adds `Secure` to the refresh-token cookie. Defaults to false because the installer's
    # TLS mode is opt-in: browsers silently drop a Secure cookie over plain HTTP, so a
    # true default would break login on every non-TLS install. Deployments that terminate
    # TLS (Caddy, or an ingress with cert-manager) should set COSY_SECURITY_COOKIE_SECURE
    # to true — without it the month-long refresh cookie also travels over plain HTTP and
    # can be overwritten by a network attacker.
    cookie-secure: ${COSY_SECURITY_COOKIE_SECURE:false}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - https://cosy.jannekeipert.de
      - https://cosy-docker.pybay.de
  games-api:
    url: https://cosy-game-api.jannekeipert.de
  templates-api:
    url: https://cosy-templates.jannekeipert.de/v3/templates
    games-url: https://cosy-templates.jannekeipert.de/v3/games
  custom-metrics:
    base-url: http://host.docker.internal:8080
    period-seconds: 2
  loki:
    username: ${COSY_LOKI_USER:loki-user}
    password: ${COSY_LOKI_PASSWORD:loki-password}
    url: http://localhost:3100
    application-name: cosy-backend # Label to identify logs from this application
  influx:
    url: http://localhost:8086
    token: ${COSY_INFLUX_TOKEN:cosy-admin-token}
    org: cosy-org
    bucket: cosy-bucket
  engine:
    # Docker-specific configuration
    docker:
      socket-path: ${COSY_DOCKER_SOCKET_PATH:unix:///var/run/docker.sock} # Docker socket
      tls: false # Whether to use TLS
      cert-path: "" # Path to TLS certs if enabled
      volume-directory: ${COSY_DOCKER_VOLUME_DIRECTORY:./dummy/cosy/volume-mounts}
      container-name-prefix: ${COSY_DOCKER_CONTAINER_PREFIX:cosy-} # Prefix for container names
      in-backend-volume-mount-path: ${COSY_DOCKER_BACKEND_VOLUME_MOUNT_PATH:./dummy/cosy/volume-mounts}
    # Safety net against lost engine status events: every interval the persisted status of each
    # game server is re-derived from the real container state. Servers that entered a transitional
    # status (AWAITING_UPDATE, PULLING_IMAGE, STOPPING) within the grace period are skipped, so the
    # sweep never fights an in-flight start or stop.
    reconciliation:
      interval-ms: ${COSY_ENGINE_RECONCILIATION_INTERVAL_MS:180000}
      grace-period-ms: ${COSY_ENGINE_RECONCILIATION_GRACE_PERIOD_MS:60000}
  footer:
    full-name: ${COSY_FOOTER_FULL_NAME:Full Name}
    email: ${COSY_FOOTER_EMAIL:yourEmail@example.org}
    phone: ${COSY_FOOTER_PHONE:+49 123 4567890}
    street: ${COSY_FOOTER_STREET:Street 5}
    city: ${COSY_FOOTER_CITY:12345 City}
  defaults:
    owner:
      username: admin
      password: admin
    initialize-dummy-data: true
