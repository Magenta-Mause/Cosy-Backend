server:
  servlet:
    context-path: /api
spring:
  application:
    name: cosy-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/cosy
    username: cosy
    password: cosy
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    property-naming-strategy: SNAKE_CASE
jwt:
  secret-key: ${COSY_JWT_SECRET_KEY:e8996bf24977ce5615015c717447911799207025d1998a01256b7b7717bac18e} #change in prod
  identity-token-expiration-time: 3600000 #1 hour
  refresh-token-expiration-time: 2678400000 #1 month
management:
  endpoints:
    web:
      exposure:
        include: "health,readiness,liveness"
influx:
  url: http://localhost:8086
  token: YXRo-4B2NR8nMu9aCP0p8LD2mDmoCHx5kgjgCGJXh02LbFJ0TBZqW8VssQWq2gV3lpiJPYk_zXBQnhOUeVfWKQ==
  org: cosy-org
  bucket: cosy-bucket
cosy:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - https://cosy.jannekeipert.de
      - https://cosy-docker.pybay.de
  games-api:
    url: https://cosy-game-api.jannekeipert.de
  loki:
    username: ${COSY_LOKI_PASSWORD:loki-user}
    password: ${COSY_LOKI_PASSWORD:loki-password}
    url: http://localhost:3100
    application-name: cosy-backend # Label to identify logs from this application
  engine:
    selected: DOCKER

    # Docker-specific configuration
    docker:
      socket-path: ${COSY_DOCKER_SOCKET_PATH:unix:///var/run/docker.sock}  # Docker socket
      tls: false                                # Whether to use TLS
      cert-path: ""                             # Path to TLS certs if enabled

    # Kubernetes-specific configuration
    kubernetes:
      kubeconfig: ${COSY_KUBECONFIG_PATH:~/.kube/config} # Path to kubeconfig file
      context: "docker-desktop"                 # Docker Desktop Kubernetes context
      namespace: "default"                      # Namespace to operate in
      in-cluster: false                         # Backend runs on host, not in cluster
      timeout-seconds: 30                       # Request timeout (seconds)

      labels: # Default labels added to all pods
        app: cosy
        platform: docker-desktop
